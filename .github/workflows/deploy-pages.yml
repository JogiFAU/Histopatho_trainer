name: Histopathologie-Atlas auf GitHub Pages veröffentlichen

on:
  # Pages must publish Vite's compiled dist directory, not a source branch.
  # Run this workflow for every pushed branch so a PR branch selected for a
  # test deployment is built in exactly the same way as main.
  push: {}
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Repository laden
        uses: actions/checkout@v6

      - name: pnpm einrichten
        uses: pnpm/action-setup@v6

      - name: Node.js einrichten
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Abhängigkeiten installieren
        run: pnpm install --frozen-lockfile

      - name: Statische App erstellen
        run: pnpm run build

      - name: GitHub Pages vorbereiten
        uses: actions/configure-pages@v5

      - name: Seitenpaket hochladen
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: GitHub Pages veröffentlichen
        id: deployment
        uses: actions/deploy-pages@v4
